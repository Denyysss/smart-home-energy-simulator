<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулятор Енергонезалежності</title>
    <!-- Підключаємо Chart.js для графіків -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .dashboard { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .sidebar { width: 300px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .main-content { flex-grow: 1; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; color: #333; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .btn:hover { background-color: #0056b3; }
        .stats-box { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 8px; text-align: center; font-size: 18px; font-weight: bold; }
        .app-list { font-size: 13px; color: #555; background: #f8f9fa; padding: 10px; border-radius: 6px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <h1 style="text-align: center; color: #333;">⚡ Симулятор Енергонезалежності Будинку</h1>

    <div class="dashboard">
        <!-- Ліва панель налаштувань -->
        <div class="sidebar">
            <h3>Параметри</h3>
            <div class="form-group">
                <label>Сонячні панелі (Пікова потужність, Вт)</label>
                <input type="number" id="solarPeak" value="3000">
            </div>
            <div class="form-group">
                <label>Ємність акумулятора (Вт·год)</label>
                <input type="number" id="batteryCap" value="2048">
            </div>
            
            <div class="app-list">
                <strong>Тестові прилади в системі:</strong><br>
                1. Холодильник (150 Вт) - 24 год<br>
                2. Бойлер (2000 Вт) - 7:00, 19:00<br>
                3. Освітлення (100 Вт) - 18:00 - 22:00
            </div>

            <button class="btn" onclick="runSimulation()">Розрахувати баланс</button>
            
            <div class="stats-box" id="costResult">
                Вартість за добу: 0.00 грн
            </div>
        </div>

        <!-- Права панель із графіком -->
        <div class="main-content">
            <canvas id="energyChart"></canvas>
        </div>
    </div>

    <script>
        let chartInstance = null;

        // Жорстко задані прилади для першого тесту
        const defaultAppliances = [
            { name: "Холодильник", power_w: 150, hours: Array.from({length: 24}, (_, i) => i) },
            { name: "Бойлер", power_w: 2000, hours: [7, 19] },
            { name: "Освітлення", power_w: 100, hours: [18, 19, 20, 21, 22] }
        ];

        async function runSimulation() {
            // Збираємо значення з полів вводу
            const solar_peak = parseFloat(document.getElementById('solarPeak').value) || 0;
            const battery_cap = parseFloat(document.getElementById('batteryCap').value) || 0;

            // Формуємо JSON за контрактом нашої Pydantic схеми
            const requestBody = {
                appliances: defaultAppliances,
                solar: { peak_power_w: solar_peak },
                battery: { capacity_wh: battery_cap, initial_charge_wh: 0 },
                tariff_day: 4.32
            };

            try {
                // Робимо POST-запит на локальний сервер FastAPI
                const response = await fetch('http://127.0.0.1:8000/api/simulate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) throw new Error("Помилка мережі або сервера");

                const data = await response.json();
                
                // Оновлюємо суму на екрані
                document.getElementById('costResult').innerText = `Вартість за добу: ${data.total_cost} грн`;
                
                // Перемальовуємо графік
                renderChart(data);

            } catch (error) {
                console.error("Помилка:", error);
                alert("Не вдалося підключитися. Перевір, чи запущений сервер (main.py)!");
            }
        }

        function renderChart(data) {
            const ctx = document.getElementById('energyChart').getContext('2d');
            const labels = Array.from({length: 24}, (_, i) => `${i}:00`);

            // Знищуємо старий графік перед малюванням нового
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Споживання (Вт)',
                            data: data.consumption,
                            backgroundColor: 'rgba(255, 99, 132, 0.8)',
                            order: 2 // Малюється позаду
                        },
                        {
                            label: 'Генерація сонця (Вт)',
                            data: data.solar_generation,
                            backgroundColor: 'rgba(75, 192, 192, 0.7)',
                            order: 3 // Малюється позаду
                        },
                        {
                            label: 'Заряд акумулятора (Вт·год)',
                            data: data.battery_level,
                            type: 'line', // Робимо це лінією поверх стовпчиків
                            borderColor: 'rgba(54, 162, 235, 1)',
                            borderWidth: 3,
                            fill: false,
                            tension: 0.4, // Плавний вигин лінії
                            order: 1 // Малюється поверх усього
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: { display: true, text: 'Енергетичний баланс будинку', font: { size: 18 } }
                    },
                    scales: {
                        y: { beginAtZero: true, title: { display: true, text: 'Потужність / Ємність' } }
                    }
                }
            });
        }

        // Автоматично запускаємо симуляцію при відкритті сторінки
        window.onload = runSimulation;
    </script>
</body>
</html>
